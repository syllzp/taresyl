version: '3.8'

services:
  frontend:
    image: ghcr.io/syllzp/taresyl-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network
  
  backend:
    image: ghcr.io/syllzp/taresyl-backend:latest
    ports:
      - "8000:8000"
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge