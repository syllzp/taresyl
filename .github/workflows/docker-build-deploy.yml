name: Build and Deploy Docker Containers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # 登录到GitHub Packages
    - name: Login to GitHub Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'push'
    
    # 构建并推送前端镜像到GitHub Packages
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: |
          ghcr.io/syllzp/taresyl-frontend:${{ github.sha }}
          ghcr.io/syllzp/taresyl-frontend:latest
    
    # 构建并推送后端镜像到GitHub Packages
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: |
          ghcr.io/syllzp/taresyl-backend:${{ github.sha }}
          ghcr.io/syllzp/taresyl-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 这里可以添加部署步骤，例如使用SSH部署到服务器
    # 或者部署到Kubernetes集群
    
    - name: Deploy completed
      run: echo "Deployment completed successfully!"