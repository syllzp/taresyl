name: Test GHCR Push Functionality

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-ghcr.yml'

jobs:
  test-ghcr-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # 登录到GitHub Packages
    - name: Login to GitHub Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # 创建一个简单的测试Dockerfile
    - name: Create test Dockerfile
      run: |
        echo 'FROM alpine:latest' > test.Dockerfile
        echo 'RUN echo "Test GHCR push functionality" > /test.txt' >> test.Dockerfile
        echo 'CMD cat /test.txt' >> test.Dockerfile
    
    # 构建并推送测试镜像到GitHub Packages
    - name: Build and push test image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./test.Dockerfile
        push: true
        tags: |
          ghcr.io/syllzp/taresyl-test:latest
          ghcr.io/syllzp/taresyl-test:${{ github.sha }}
    
    # 验证镜像是否可以拉取
    - name: Pull and test the image
      run: |
        docker pull ghcr.io/syllzp/taresyl-test:latest
        docker run --rm ghcr.io/syllzp/taresyl-test:latest
